# TC-AUTH-002 — Signed-out user can open the Forgot Password screen from Login
# Test case: test-cases/authentication/TC-AUTH-002-open-forgot-password-from-login.md
# Precondition: no user signed in on the device. App data is NOT cleared.
# No text is entered and Send OTP is never tapped.
appId: app.icontraining.icon
name: TC-AUTH-002 open Forgot Password from Login
tags:
  - auth
---
- launchApp:
    clearState: false
    # Set explicitly to the device's current state (docs/automation-strategy.md §12).
    permissions:
      notifications: allow
- assertVisible: "Start"
- tapOn: "Login"
- assertVisible: "Log in to your account"
- tapOn: "Forgot password\\?"
- assertVisible: "Forgot Password"
- assertVisible: "Just enter the Email address associated with your account"
- assertVisible: "Send OTP"
